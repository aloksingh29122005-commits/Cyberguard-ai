{% extends "base.html" if g.user else "auth_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="error-box">
  <p class="error-code">{{ code }}</p>
  <h1 class="auth-title">{{ title }}</h1>
  <p class="auth-sub">{{ message }}</p>
  {% if g.user %}
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
  {% else %}
  <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Go to login</a>
  {% endif %}
</div>
{% endblock %}
