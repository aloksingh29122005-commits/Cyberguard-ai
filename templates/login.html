{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<h1 class="auth-title">Log in</h1>
<p class="auth-sub">Use the email and password you registered with.</p>

<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required autofocus>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="input-row">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="link-btn" data-toggle-password="password">Show</button>
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-block">Log in</button>
</form>

<p class="auth-alt">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
